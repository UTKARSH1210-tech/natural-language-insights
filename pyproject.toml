[project]
name = "natural-language-insights"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "duckdb>=1.0,<2",
    "fastapi>=0.115,<1",
    "google-genai>=2.22.0",
    "httpx>=0.27,<1",
    "ollama>=0.6.2",
    "openai>=1.0,<2",
    "pydantic>=2.8,<3",
    "pytest>=8,<9",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.9,<1",
    "ruff>=0.6,<1",
    "sqlglot>=25,<30",
    "streamlit>=1.63.0",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
natural-language-insights = "natural_language_insights:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
